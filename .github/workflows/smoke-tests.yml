name: Sheaf GNN Smoke Tests

on:
  push:
    branches: [main, sheaf-verified-integration, develop]
  pull_request:
    branches: [main, sheaf-verified-integration, develop]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pyyaml
          pip install pytest pytest-cov
          pip install -e . --no-deps 2>/dev/null || true

      - name: Run end-to-end smoke tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          python test_sheaf_end_to_end.py

      - name: Run Gate 1: Leakage Assertion
        run: |
          python -m pytest tests/test_splits.py -v

      - name: Run Gate 2: Sheaf Math Properties (P1–P5)
        run: |
          python -m pytest tests/test_sheaf_math.py -v

      - name: Run Gate 3: Reproducibility Check
        run: |
          python -m pytest tests/test_reproducibility.py -v

      - name: Run Gate 4: Data-Dir Resolution
        run: |
          python -m pytest tests/test_data_dir.py -v

      - name: Run Gate 5: Sparse Laplacian Verification
        run: |
          python -m pytest tests/test_sparse_laplacian.py -v

      - name: Run GRN Masking Tests
        run: |
          python -m pytest tests/test_grn_construction.py -v

      - name: Generate coverage report
        run: |
          python -m pytest tests/ --cov=src/tsgnn --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run black (code formatting check)
        run: black --check src/ tests/ scripts/
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: isort --check-only src/ tests/ scripts/
        continue-on-error: true

      - name: Run flake8 (linting)
        run: flake8 src/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
