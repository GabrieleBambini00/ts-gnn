name: Sheaf GNN Smoke Tests

on:
  push:
    branches: [main, sheaf-verified-integration, develop]
  pull_request:
    branches: [main, sheaf-verified-integration, develop]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pyyaml pytest pytest-cov

      - name: Run end-to-end smoke tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python test_sheaf_end_to_end.py

      - name: Run Gate 1: Leakage Assertion
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_splits.py -v || true

      - name: Run Gate 2: Sheaf Math Properties (P1–P5)
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_sheaf_math.py -v || true

      - name: Run Gate 3: Reproducibility Check
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_reproducibility.py -v || true

      - name: Run Gate 4: Data-Dir Resolution
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_data_dir.py -v || true

      - name: Run Gate 5: Sparse Laplacian Verification
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_sparse_laplacian.py -v || true

      - name: Run GRN Masking Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -m pytest tests/test_grn_construction.py -v || true

  lint:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run black (code formatting check)
        run: black --check src/ tests/ scripts/ 2>/dev/null || echo "Black formatting issues found (non-blocking)"
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: isort --check-only src/ tests/ scripts/ 2>/dev/null || echo "Isort issues found (non-blocking)"
        continue-on-error: true

      - name: Run flake8 (linting)
        run: flake8 src/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics 2>/dev/null || echo "Flake8 issues found (non-blocking)"
        continue-on-error: true
