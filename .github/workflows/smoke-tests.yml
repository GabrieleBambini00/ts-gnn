name: Sheaf GNN Smoke Tests

on:
  push:
    branches: [main, sheaf-verified-integration, develop]
  pull_request:
    branches: [main, sheaf-verified-integration, develop]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pyyaml

      - name: Verify imports
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          python -c "import torch; import numpy as np; print(f'Torch: {torch.__version__}, NumPy: {np.__version__}')"

      - name: Run end-to-end smoke tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          cd ${{ github.workspace }}
          python test_sheaf_end_to_end.py
        continue-on-error: false
