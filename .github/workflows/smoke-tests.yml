name: Sheaf GNN Smoke Tests

on:
  push:
    branches: [main, sheaf-verified-integration, develop]
  pull_request:
    branches: [main, sheaf-verified-integration, develop]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pip + wheel
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install numpy
        run: pip install numpy && python -c "import numpy; print(f'NumPy OK: {numpy.__version__}')"

      - name: Install scipy
        run: pip install scipy && python -c "import scipy; print(f'SciPy OK: {scipy.__version__}')"

      - name: Install scikit-learn
        run: pip install scikit-learn && python -c "import sklearn; print(f'scikit-learn OK')"

      - name: Install PyYAML
        run: pip install pyyaml && python -c "import yaml; print(f'PyYAML OK')"

      - name: Install PyTorch (CPU)
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'PyTorch OK: {torch.__version__}')"

      - name: Test basic imports
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import test_sheaf_end_to_end; print('Module import OK')"

      - name: Run smoke test
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          cd ${{ github.workspace }}
          python test_sheaf_end_to_end.py
